[project]
name = "draftfc"
version = "0.4.0"
description = "Plataforma local e multiplayer de Draft para EA Sports FC 26 e 27 (PC)"
requires-python = ">=3.11"
dependencies = [
    "curl_cffi>=0.7.0",
    "lxml>=5.2.0",
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scraper*", "backend*", "frontend*"]